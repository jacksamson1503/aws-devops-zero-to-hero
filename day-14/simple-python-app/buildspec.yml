version: 0.2

phases:
  pre_build:
    commands:
      - echo "Fetching Docker credentials from Parameter Store..."
      - USERNAME=$(aws ssm get-parameter --name "/myapp/docker-credentials/username" --with-decryption --query "Parameter.Value" --output text)
      - PASSWORD=$(aws ssm get-parameter --name "/myapp/docker-credentials/password" --with-decryption --query "Parameter.Value" --output text)
      - REGISTRY=$(aws ssm get-parameter --name "/myapp/docker-registry/url" --with-decryption --query "Parameter.Value" --output text)
      - echo "Logging into Docker Hub..."
      - echo "$PASSWORD" | docker login -u "$USERNAME" --password-stdin $REGISTRY

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $USERNAME/myapp:latest .
      - echo "Pushing image to Docker Hub..."
      - docker push $USERNAME/myapp:latest

  post_build:
    commands:
      - echo "Docker image pushed successfully!"
      - echo "Build completed on `date`"


